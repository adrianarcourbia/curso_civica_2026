version: 2

models:
  - name: stg_POSTGRE_DB__PRODUCTS
    config:
      contract:
        enforced: true
    description: >
      Data about all products in demo.
    columns:
      - name: product_id
        data_type: text
        description: >
          UUID for each unique product on platform.
        data_tests:
          - not_null
        constraints:
          - type: not_null

      - name: name
        data_type: TEXT
        description: >
          Name of the product.
        constraints:
          - type: not_null

      - name: unit_price_usd
        data_type: real
        description: >
          Price of the product.
        constraints:
          - type: not_null

      - name: inventory
        data_type: NUMBER
        description: >
          Amount of the inventory we have for this product.
        constraints:
          - type: not_null

      - name: _fivetran_deleted
        data_type: TIMESTAMP_TZ
        description: >
          Date that the data was loaded.
        constraints:
          - type: not_null

      - name: _fivetran_synced
        data_type: TIMESTAMP_TZ
        description: >
          Date that the data was loaded.
        constraints:
          - type: not_null
